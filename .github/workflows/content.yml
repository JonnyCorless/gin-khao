# Push lessons -> generate any missing Thai audio -> publish the content feed to GitHub Pages.
# The app downloads from https://jonnycorless.github.io/gin-khao/ on open.
name: Publish content

on:
  push:
    branches: [main]
    paths: ['content/**', 'tools/**', 'audio/**', '.github/workflows/content.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts pyyaml
      - name: Build content (and generate missing audio)
        run: python tools/build_content.py
      - name: Save any new audio back to the repo
        run: |
          git config user.name "gin-khao-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if ! git diff --cached --quiet; then
            git commit -m "Generate audio [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
