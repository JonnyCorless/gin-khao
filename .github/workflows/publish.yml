# One pipeline, LifeRPG-style updates:
#   push to main  -> lessons, audio and web code published; the app downloads them on open
#   push a v* tag -> builds a signed APK release, then re-runs the main publish so the
#                    app offers it in Settings > App updates
# Only main deploys the site, so a tag build can never be overwritten by an older feed.
# Everything is served from https://jonnycorless.github.io/gin-khao/
name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  apk:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Versions
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "$NAME"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=$NAME" >> "$GITHUB_ENV"
          echo "VITE_WEB_BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Content
        run: |
          pip install pyyaml
          python tools/build_content.py --check
      - run: npm ci
      - run: npm run build

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          npx cap sync android
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/gin-khao-$VERSION_NAME.apk"

      # Notes shown in the app: an annotated tag's message (git tag -a v0.1.2 -m "..."), else the commit subject.
      - name: GitHub release
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          NOTES="$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' | sed '/-----BEGIN/,$d')"
          [[ -n "${NOTES// }" ]] || NOTES="$(git log -1 --format=%s)"
          gh release create "$GITHUB_REF_NAME" "gin-khao-$VERSION_NAME.apk" --title "$GITHUB_REF_NAME" --notes "$NOTES"

      - name: Re-publish the site with this APK
        run: gh workflow run publish.yml --ref main

  site:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      VITE_WEB_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Audio is made on the PC (Microsoft blocks edge-tts from GitHub's servers); this only checks it's all there.
      - name: Content
        run: |
          pip install pyyaml
          python tools/build_content.py --check
      - run: npm ci
      - run: npm run build

      - name: Web update bundle
        run: |
          mkdir -p site/web
          rsync -a --exclude bundled dist/ site/web/
          node tools/web_version.mjs site/web "$VITE_WEB_BUILD"
      - name: Latest APK for Settings > App updates
        run: |
          mkdir -p site/apk
          TAG="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName' || true)"
          if [[ -n "$TAG" ]]; then
            NAME="${TAG#v}"
            IFS=. read -r MA MI PA <<< "$NAME"
            gh release download "$TAG" --pattern '*.apk' --dir site/apk
            FILE="$(cd site/apk && ls *.apk | head -1)"
            NOTES="$(gh release view "$TAG" --json body --jq .body | head -c 300)"
            jq -n --argjson code $((MA * 10000 + MI * 100 + PA)) --arg name "$NAME" --arg file "$FILE" --arg notes "$NOTES" \
              '{code: $code, name: $name, file: $file, notes: $notes}' > site/apk/latest.json
            cat site/apk/latest.json
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
