# Tag a version (git tag v0.1.0 && git push --tags) -> build a signed APK -> GitHub Release.
# Obtainium on the phone watches these releases.
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Version from tag
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || NAME="0.0.0-manual"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=$NAME" >> "$GITHUB_ENV"

      - name: Bundle current content (no new audio is generated here)
        run: |
          pip install edge-tts pyyaml
          python tools/build_content.py --no-audio

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Strip any Windows line endings/whitespace that came with the secret.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/gin-khao-$VERSION_NAME.apk"

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: gin-khao-*.apk
          generate_release_notes: true
