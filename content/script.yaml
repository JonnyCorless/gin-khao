- id: letters-1
  type: letter
  title: Letters 1 · seven easy ones
  blurb: Mid-class letters. Each has a name word, like "a for apple". ก is gor gài, g for chicken.
  items:
    - {id: l-g, th: ก, say: กอ ไก่, rom: gor gài, en: g, word: chicken, cls: mid}
    - {id: l-j, th: จ, say: จอ จาน, rom: jor jaan, en: j, word: plate, cls: mid}
    - {id: l-d, th: ด, say: ดอ เด็ก, rom: dor dèk, en: d, word: child, cls: mid}
    - {id: l-t, th: ต, say: ตอ เต่า, rom: tor tào, en: t (no puff), word: turtle, cls: mid}
    - {id: l-b, th: บ, say: บอ ใบไม้, rom: bor bai-mái, en: b, word: leaf, cls: mid}
    - {id: l-p, th: ป, say: ปอ ปลา, rom: por plaa, en: p (no puff), word: fish, cls: mid}
    - {id: l-o, th: อ, say: ออ อ่าง, rom: or àang, en: '(silent, holds a vowel)', word: basin, cls: mid}
