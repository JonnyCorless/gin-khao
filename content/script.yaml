- id: vowels
  type: vowel
  title: Vowels
  blurb: Vowels sit before, after, above or below the letter. Shown here on อ, the silent holder. The voice says each one the way Thai teachers do, sà-rà (vowel) then the sound.
  items:
    - {id: v-aa, th: อา, say: สระอา, rom: aa, en: aa (father)}
    - {id: v-a, th: อะ, say: สระอะ, rom: a, en: a (short)}
    - {id: v-ee, th: อี, say: สระอี, rom: ee, en: ee (see)}
    - {id: v-i, th: อิ, say: สระอิ, rom: i, en: i (short ee)}
    - {id: v-uu, th: อู, say: สระอู, rom: uu, en: uu (too)}
    - {id: v-u, th: อุ, say: สระอุ, rom: u, en: u (short oo)}
    - {id: v-e, th: เอ, say: สระเอ, rom: e, en: e (hey)}
    - {id: v-ae, th: แอ, say: สระแอ, rom: ae, en: ae (cat)}
    - {id: v-oo, th: โอ, say: สระโอ, rom: oo, en: oo (go)}
    - {id: v-ai, th: ไอ, say: สระไอ, rom: ai, en: ai (Thai)}
    - {id: v-ao, th: เอา, say: สระเอา, rom: ao, en: ao (how)}
    - {id: v-am, th: อำ, say: สระอำ, rom: am, en: am (sum)}
    - {id: v-or, th: ออ, say: สระออ, rom: or, en: or (law)}
    - {id: v-ue, th: อือ, say: สระอือ, rom: ue, en: ue (oo with a smile)}
