# Reading Thai. Sign words first (recognise the whole word by its shape), then the letters.
# Each lesson becomes a reading drill: see it, pick what it means; the audio plays after you answer.
# say: what the voice reads, when it differs from th (letter names, digits, lone vowels).
# Letter cls: mid, low or high class. The class decides the tone later on.
