# Situations in Browse, in curriculum order. New phrases in Today are taught in this order.
# icon: one of the line icons in app/ui/icons.tsx
- id: basics
  title: Getting by
  th: เอาตัวรอด
  icon: hand
  blurb: The lines that get you out of trouble at any counter.
- id: shop
  title: Shops & 7-Eleven
  th: ร้านสะดวกซื้อ
  icon: bag
  blurb: The till asks the same few questions every time. Learn to hear them and the visit becomes routine.
- id: food
  title: Food & stalls
  th: ร้านอาหาร
  icon: bowl
  blurb: Noodle shops ask short questions in the same order. Each has two or three answers.
- id: numbers
  title: Numbers & prices
  th: ตัวเลข
  icon: coins
  blurb: Prices come fast. Train your ear until haa sìp and haa rói stop sounding alike.
- id: petrol
  title: Petrol
  th: ปั๊มน้ำมัน
  icon: fuel
  blurb: The same pattern as every other counter, with a scooter twist.
- id: scooter
  title: Scooter life
  th: มอเตอร์ไซค์
  icon: scooter
  blurb: The repair shop, parking, and the police checkpoint. Short, calm and polite gets you through all three.
- id: home
  title: Home & landlord
  th: บ้านเช่า
  icon: home
  blurb: Rent, things that break, and everything that gets delivered to the gate.
- id: health
  title: Pharmacy & health
  th: ร้านขายยา
  icon: pill
  blurb: Thai pharmacists help without a prescription. Say what's wrong, then listen for how often to take it.
- id: around
  title: Getting around
  th: ถามทาง
  icon: walk
  blurb: On foot or by bike. Ask, then listen for left, right, straight and "close by".
- id: social
  title: Neighbours
  th: เพื่อนบ้าน
  icon: people
  blurb: The same few friendly questions, every day. Have your answers ready.
